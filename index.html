<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Euodoo Meet - video conferencing and collaboration" />
    <title>Euodoo Meet</title>
    <style>
        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
            background: #f8fafc;
            color: #334155;
        }
        main {
            text-align: center;
        }
        .spinner {
            width: 34px;
            height: 34px;
            margin: 0 auto 14px;
            border: 3px solid #cbd5e1;
            border-top-color: #00817a;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }
        @keyframes spin { to { transform: rotate(360deg); } }
        p { margin: 0 0 14px; font-size: 15px; }
        a {
            color: #00817a;
            font-weight: 600;
            text-decoration: none;
        }
        a:hover { text-decoration: underline; }
    </style>
</head>
<body>
    <main>
        <div class="spinner" aria-hidden="true"></div>
        <p id="loading">Taking you to Euodoo Meet&hellip;</p>
        <p>If you are not redirected, <a href="login.html">Continue to Euodoo Meet</a></p>
    </main>
    <script>
        (function () {
            // Keep the loading message accessible while the redirect happens.
            var msg = document.getElementById('loading');
            if (msg) msg.textContent = 'Taking you to Euodoo Meet\u2026';
            // Relative redirect so the app works from any deployment root.
            window.location.replace('login.html');
        })();
    </script>
</body>
</html>
